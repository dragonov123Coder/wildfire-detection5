<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wildfire Detection System - Home</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }

        .container {
            text-align: center;
            max-width: 600px;
            padding: 40px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            color: #fff;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #999;
            margin-bottom: 50px;
            font-weight: 300;
        }

        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 40px;
        }

        .button-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            border: 2px solid #333;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: inherit;
            min-height: 250px;
        }

        .button-card:hover {
            border-color: #555;
            background: linear-gradient(135deg, #252525 0%, #353535 100%);
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .button-card:active {
            transform: translateY(-2px);
        }

        .icon {
            font-size: 3.5rem;
            margin-bottom: 20px;
            display: block;
        }

        .button-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: #fff;
        }

        .button-description {
            font-size: 0.95rem;
            color: #aaa;
            line-height: 1.5;
        }

        .button-card.dashboard .icon {
            background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .button-card.prediction .icon {
            background: linear-gradient(135deg, #4ecdc4, #44a5c2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .footer {
            color: #666;
            font-size: 0.9rem;
            margin-top: 50px;
            padding-top: 30px;
            border-top: 1px solid #333;
        }

        @media (max-width: 600px) {
            .button-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            h1 {
                font-size: 2rem;
            }

            .container {
                padding: 20px;
            }

            .button-card {
                min-height: 200px;
                padding: 30px 15px;
            }

            .icon {
                font-size: 2.5rem;
            }

            .button-title {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔥 Wildfire Detection System</h1>
        <p class="subtitle">Integrated Monitoring & Prediction</p>

        <div class="button-grid">
            <a href="/dashboard" class="button-card dashboard">
                <span class="icon">📊</span>
                <div class="button-title">Dashboard</div>
                <div class="button-description">Live monitoring with RGB and thermal cameras</div>
            </a>

            <a href="/prediction" class="button-card prediction">
                <span class="icon">🤖</span>
                <div class="button-title">Prediction System</div>
                <div class="button-description">Fire risk prediction and analysis</div>
            </a>
        </div>

        <div class="footer">
            <p>Wildfire Detection System v2.0</p>
        </div>
    </div>
</body>
</html>
